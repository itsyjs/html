name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm (version from `packageManager`), Node, and the install, in one step.
      # `runtime: node` means the current LTS; without it no Node is installed at all.
      # No --frozen-lockfile flag: pnpm already refuses to update a lockfile when CI is set.
      - uses: pnpm/setup@v2
        with:
          runtime: node
          cache: true
      - run: pnpm check
      - run: pnpm publish --access public --no-git-checks
